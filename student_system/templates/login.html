<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #ffffff; }
    </style>
</head>
<body>

<div class="login-card">
    <h4 class="text-center text-primary fw-bold mb-3">المعهد العالي سلوق</h4>
    <h6 class="text-center text-muted mb-4">تسجيل الدخول للوحة التحكم</h6>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} text-center p-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold">اسم المستخدم:</label>
            <input type="text" name="username" class="form-control" required placeholder="أدخل اسم المستخدم">
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">كلمة المرور:</label>
            <input type="password" name="password" class="form-control" required placeholder="أدخل كلمة المرور">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">دخول</button>
    </form>
</div>

</body>
</html>
