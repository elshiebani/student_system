<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعهد العالي للعلوم والتكنولوجيا سلوق - منظومة التسجيل</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-section {
            background-color: #ffffff;
            border-bottom: 3px solid #0d6efd;
            padding: 20px 0;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo-img {
            max-height: 100px;
            width: auto;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            background: #ffffff;
        }
        .btn-primary-custom {
            background-color: #0d6efd;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-primary-custom:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="header-section text-center">
    <div class="container">
        <!-- شعار المعهد العالي سلوق -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="شعار المعهد العالي للعلوم والتكنولوجيا سلوق" class="logo-img mb-2" onerror="this.style.display='none'">
        <h4 class="text-primary fw-bold m-0">المعهد العالي للعلوم والتكنولوجيا سلوق</h4>
        <p class="text-muted small mt-1 mb-0">منظومة التسجيل والقبول الإلكتروني</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-custom p-4">
                <h5 class="text-center mb-4 text-secondary border-bottom pb-2">استمارة تسجيل طالب جديد</h5>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} text-center">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="/register" method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">الاسم الثلاثي:</label>
                        <input type="text" name="full_name" class="form-control" required placeholder="أدخل الاسم الثلاثي">
                    </div>

                    <!-- 1. الرقم الوطني (12 خانة ويبدأ بـ 1 أو 2) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">الرقم الوطني:</label>
                        <input type="text" 
                               name="national_id" 
                               class="form-control" 
                               pattern="[12][0-9]{11}" 
                               maxlength="12" 
                               placeholder="يتكون من 12 رقم (يبدأ بـ 1 أو 2)" 
                               title="الرقم الوطني يتكون من 12 رقماً ويبدأ بالرقم 1 أو 2" 
                               required>
                    </div>

                    <!-- 2. رقم هاتف ولي الأمر -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">رقم هاتف ولي الأمر:</label>
                        <input type="tel" name="parent_phone" class="form-control" required placeholder="09X XXXXXXX">
                    </div>

                    <!-- قائمة التخصصات الكاملة الخاصة بالمعهد -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">القسم / التخصص الدراسي:</label>
                        <select name="department" class="form-select" required>
                            <option value="" selected disabled>-- اختر التخصص --</option>
                            <option value="الحاسوب وتكنولوجيا المعلومات">الحاسوب وتكنولوجيا المعلومات</option>
                            <option value="العلوم الإدارية والمالية">العلوم الإدارية والمالية</option>
                            <option value="الهندسة الكهربائية والإلكترونية">الهندسة الكهربائية والإلكترونية</option>
                            <option value="الهندسة الميكانيكية">الهندسة الميكانيكية</option>
                            <option value="المهن الطبية المساعدة">المهن الطبية المساعدة</option>
                        </select>
                    </div>

                    <!-- 3. صورة المؤهل العلمي بدلاً من الصورة الشخصية -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">صورة المؤهل العلمي (الشهادة / الإفادة):</label>
                        <input type="file" name="qualifier_image" class="form-control" accept="image/*,.pdf" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">شهادة الميلاد / مرفق إضافي:</label>
                        <input type="file" name="cert_file" class="form-control" accept="image/*,.pdf">
                    </div>

                    <button type="submit" class="btn btn-primary-custom text-white w-100">حفظ البيانات والتسجيل</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
