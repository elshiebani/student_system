<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام الطلب - المعهد العالي سلوق</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light text-center py-5">
    <div class="container">
        <div class="card card-custom p-5 mx-auto" style="max-width: 600px;">
            <div class="mb-3 text-success" style="font-size: 60px;">✓</div>
            <h3 class="fw-bold mb-3">تم تسليم طلب التسجيل بنجاح!</h3>
            <p class="text-muted">شكراً لك <strong>{{ full_name }}</strong>، تم استقبال مستنداتك ورغبتك في الالتحاق بـ (<strong>{{ department }}</strong>).</p>
            <div class="alert alert-secondary my-3">
                الرقم المرجعي لمتابعة طلبك هو الرقم الوطني: <strong>{{ national_id }}</strong>
            </div>
            <a href="/admission" class="btn btn-primary-custom text-white mt-3">العودة للرئيسية</a>
        </div>
    </div>
</body>
</html>
